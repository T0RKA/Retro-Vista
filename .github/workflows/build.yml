              out.write('package com.retrovista.launcher;\n\nimport org.json.JSONArray;\nimport org.json.JSONObject;\nimport java.io.ByteArrayOutputStream;\nimport java.io.IOException;\nimport java.io.InputStream;\nimport java.net.URL;\nimport java.net.URLEncoder;\nimport java.nio.charset.StandardCharsets;\nimport java.util.ArrayList;\nimport java.util.List;\nimport javax.net.ssl.HttpsURLConnection;\n\n/** Worker-thread only. Weather is opt-in and uses no device location. */\nfinal class WeatherClient {\n    static final class City {\n        final String label;\n        final double latitude,longitude;\n        City(String label,double latitude,double longitude) {\n            this.label=label; this.latitude=latitude; this.longitude=longitude;\n        }\n    }\n    static final class Conditions {\n        final double celsius;\n        final int code;\n        final String modelTime;\n        Conditions(double celsius,int code,String modelTime) {\n            this.celsius=celsius; this.code=code; this.modelTime=modelTime;\n        }\n    }\n    static List<City> search(String name) throws Exception {\n        JSONArray results=get("https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&format=json&name="\n                +URLEncoder.encode(name,"UTF-8")).optJSONArray("results");\n        List<City> cities=new ArrayList<>();\n        if(results==null) return cities;\n        for(int i=0;i<results.length();i++) {\n            JSONObject row=results.getJSONObject(i);\n            double lat=row.getDouble("latitude"),lon=row.getDouble("longitude");\n            if(!LauncherLogic.validCoordinates(lat,lon)) continue;\n            String label=row.getString("name");\n            if(!row.optString("admin1").isEmpty()) label+=", "+row.optString("admin1");\n            if(!row.optString("country").isEmpty()) label+=", "+row.optString("country");\n            cities.add(new City(label,lat,lon));\n        }\n        return cities;\n    }\n    static Conditions current(double latitude,double longitude) throws Exception {\n        if(!LauncherLogic.validCoordinates(latitude,longitude)) throw new IOException("Invalid city");\n        JSONObject current=get("https://api.open-meteo.com/v1/forecast?latitude="+latitude\n                +"&longitude="+longitude+"&current=temperature_2m,weather_code&temperature_unit=celsius&timezone=auto")\n                .getJSONObject("current");\n        double temperature=current.getDouble("temperature_2m");\n        if(Double.isNaN(temperature) || Double.isInfinite(temperature)) throw new IOException("Missing temperature");\n        return new Conditions(temperature,current.getInt("weather_code"),current.getString("time"));\n    }\n    private static JSONObject get(String address) throws Exception {\n        HttpsURLConnection connection=(HttpsURLConnection)new URL(address).openConnection();\n        connection.setConnectTimeout(10000); connection.setReadTimeout(10000);\n        connection.setInstanceFollowRedirects(false);\n        connection.setRequestProperty("Accept","application/json");\n        connection.setRequestProperty("User-Agent","RetroVista/1.0 (personal Android launcher)");\n        try {\n            if(connection.getResponseCode()!=200) throw new IOException("Weather service unavailable");\n            try(InputStream in=connection.getInputStream(); ByteArrayOutputStream out=new ByteArrayOutputStream()) {\n                byte[] bytes=new byte[4096]; int n;\n                while((n=in.read(bytes))!=-1) {\n                    if(out.size()+n>262144) throw new IOException("Response too large");\n                    out.write(bytes,0,n);\n                }\n                return new JSONObject(new String(out.toByteArray(),StandardCharsets.UTF_8));\n            }\n        } finally { connection.disconnect(); }\n    }\n}\n')
