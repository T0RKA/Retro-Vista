\n        cell.addView(title,lp(-1,-2)); return cell;\n    }\n    private Drawable icon(AppItem app) {\n        Drawable d=icons.get(app.id);\n        if(d==null) { try { d=app.info.loadIcon(getPackageManager()); } catch(Exception ignored) { d=getApplicationInfo().loadIcon(getPackageManager()); }\n            icons.put(app.id,d); }\n        Drawable.ConstantState state=d.getConstantState();\n        return state==null?d:state.newDrawable(getResources()).mutate();\n    }\n    private AppItem find(String id) { for(AppItem a:apps) if(a.id.equals(id)) return a; return null; }\n    private void loadApps() {\n        if(loadingApps) return; loadingApps=true;\n        workers.execute(()->{\n            List<AppItem> found=new ArrayList<>(); boolean success=true;\n            try {\n                Intent query=new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);\n                Set<String> seen=new HashSet<>();\n                for(ResolveInfo info:getPackageManager().queryIntentActivities(query,0)) {\n                    if(info.activityInfo==null || !info.activityInfo.exported || !info.activityInfo.enabled\n                            || info.activityInfo.packageName.equals(getPackageName())) continue;\n                    String label=String.valueOf(info.loadLabel(getPackageManager()));\n                    AppItem item=new AppItem(info,label);\n                    if(seen.add(item.id)) found.add(item);\n                }\n                Collator collator=Collator.getInstance();\n                found.sort((a,b)->{int n=collator.compare(a.label,b.label);return n!=0?n:a.id.compareTo(b.id);});\n            } catch(Exception ignored) { success=false; }\n            final boolean ok=success;\n            runOnUiThread(()->{\n                if(isDestroyed() || isFinishing()) return;\n                loadingApps=false;\n                if(!ok) { toast("Could not refresh apps. Try opening RetroVista again.");return; }\n                apps.clear(); apps.add