              out.write('package com.retrovista.launcher;\n\nimport android.content.Context;\nimport android.graphics.*;\nimport android.view.View;\n\n/** Original procedural wallpaper, drawn once per invalidation, not continuously. */\nfinal class RetroBackground extends View {\n    private final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);\n    private final int theme;\n    RetroBackground(Context c,int theme) {\n        super(c); this.theme=theme;\n        setImportantForAccessibility(IMPORTANT_FOR_ACCESSIBILITY_NO);\n    }\n    @Override protected void onDraw(Canvas c) {\n        float w=getWidth(),h=getHeight();\n        if(w==0 || h==0) return;\n        int[] colors=theme==1 ? new int[]{0xFF1C312C,0xFF355B45,0xFF102625}\n                : theme==2 ? new int[]{0xFF13142B,0xFF333351,0xFF0C1525}\n                : new int[]{0xFF0C2534,0xFF1C5867,0xFF0B212D};\n        p.setShader(new LinearGradient(0,0,w*.8f,h,colors,null,Shader.TileMode.CLAMP));\n        c.drawRect(0,0,w,h,p);\n        p.setShader(new RadialGradient(w*.87f,h*.32f,w*.85f,new int[]{0x4492E2CC,0x0092E2CC},null,Shader.TileMode.CLAMP));\n        c.drawRect(0,0,w,h,p); p.setShader(null);\n        for(int i=0;i<4;i++) {\n            Path wave=new Path(); float y=h*(.55f+i*.08f);\n            wave.moveTo(-w*.2f,h); wave.lineTo(-w*.2f,y);\n            wave.cubicTo(w*.18f,y-h*.17f,w*.58f,y+h*.17f,w*1.2f,y-h*.12f);\n            wave.lineTo(w*1.2f,h); wave.close();\n            p.setColor(i%2==0 ? 0x1434B9AD : 0x1829D8BA); c.drawPath(wave,p);\n        }\n        p.setColor(0x18FFFFFF);\n        for(int i=0;i<17;i++) c.drawCircle(((i*71+27)%100)/100f*w,((i*43+13)%100)/100f*h,1+(i%3),p);\n    }\n}\n')
