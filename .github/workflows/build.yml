name: Build RetroVista APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: Also run Android emulator tests (slower; requires emulator-capable runner)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: retrovista-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out your project
        uses: actions/checkout@v4
      - name: Write application sources 1 of 7
        shell: python
        run: |
          from pathlib import Path
          path = Path(".gitignore")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w", encoding="utf-8") as out:
              out.write('.gradle/\n.idea/\nlocal.properties\n**/build/\n*.jks\n*.keystore\n*.apk\n*.iml\n')
          path = Path("LICENSE")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w", encoding="utf-8") as out:
              out.write('MIT License\n\nCopyright (c) 2026 RetroVista contributors\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the Software), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED AS IS, WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n\nThis license applies to original RetroVista source and artwork. Third-party\nbuild/test dependencies keep their own licenses. Weather data is separately\nlicensed by its providers. No rights to Samsung, HTC or third-party app icons\nare granted; app icons are loaded from the apps already installed by the user.\n')
          path = Path("README.md")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w", encoding="utf-8") as out:
              out.write('# RetroVista — your retro home, rebuilt\n\n**Personal preview 1.0 · Android 10+ (API 29+) · portrait phone layout**\n\nAn original, single-app launcher inspired by early-2010s glossy home screens and split-flap clocks. Intended for your Galaxy S22 Ultra, but **not yet compiled or tested on a physical phone in the authoring environment**. No Samsung/HTC code, logos, wallpapers or proprietary assets are included. No affiliation with either company.\n\n## Easiest route: one file, no Android Studio\n\nUse the separate **RetroVista-START-HERE.html** guide. It includes a **Copy build workflow** button. Create a GitHub repository initialized with a README, then add a file called `.github/workflows/build.yml`, paste the copied contents, and commit it to your default branch. Use `main` or `master`, or manually run the workflow from Actions.\n\nThe one-file workflow contains the same buildable sources as this project. Its source-writing steps write them into the disposable GitHub runner workspace. It does not need you to upload folders or use a terminal. It does not modify your repository or request a personal access token. You must be signed into your own GitHub account.\n\nAfter a successful run: **Actions → Build RetroVista APK → successful run → Artifacts → RetroVista-APK**. Download and extract that artifact, then open **RetroVista-1.0.apk** on your phone. Read `TEST-STATUS.txt` in the artifact before installing. GitHub documents this download path here: https://docs.github.com/en/actions/how-tos/manage-workflow-runs/download-workflow-artifacts [doc:turn5doc12].\n\nThe default build runs compilation, 10 JVM test methods and Android lint. The 4 Android smoke-test methods are **optional**, using the checkbox on **Run workflow**. They are not run by default, because emulator support on a hosted runner is a separate requirement. An emulator test does not replace Samsung device testing. Build service availability and your GitHub account permissions/billing are controlled by GitHub; this project cannot create an account or run a workflow for you.\n\n## Alternative: upload this full project\n\n1. Extract the project ZIP on a computer.\n2. Create your GitHub repository. Use **Add file → Upload files** and upload the contents of the `RetroVista` folder, not the folder itself and not the ZIP. Preserve all subfolders. [doc:turn5doc11]\n3. At repository root, you should see `app`, `tools`, `settings.gradle`, `build.gradle`, and `.github`.\n4. Hidden `.github` folders are easy to miss. If Actions is empty, create `.github/workflows/build.yml` in GitHub and paste the contents of the included `BUILD-WORKFLOW.yml` file.\n5. Commit/merge into `main` or `master`. Open **Actions → Build RetroVista APK**. You can also select **Run workflow** after the file is on the default branch.\n6. Download the artifact as above.\n\n**Do not combine the full-project workflow and one-file workflow as separate workflows in the same repository. Pick one approach.** The one-file workflow reconstructs its embedded source version, so changes to separate source files would be overwritten in its temporary build workspace. Use the full project approach if you want to modify code later.\n\n## What is included\n\n- Original split-flap clock tiles, date, 12/24-hour choice, optional minute-change highlight, and tap-to-open alarms.\n- Three coordinated procedural wallpapers: Lagoon, Meadow and Midnight. No extra wallpaper files or packs required.\n- Two swipeable home pages with 8 shortcut slots each: 16 total. The first page starts with up to 8 alphabetically sorted installed apps; the second starts empty.\n- Four editable dock shortcuts: Phone, Messages, Browser and Camera; the center button always opens Apps.\n- A 4-column searchable app drawer, including case/accent-insensitive app and package search. Hold an app to pin it to any home slot or open its Android app-info page.\n- Tap an empty home slot to choose an app; hold any home/dock shortcut to replace or remove it.\n- Optional city-based Open-Meteo weather, Celsius/Fahrenheit, real condition descriptions, explicit stale/cache indicators, and provider attribution.\n- Local preferences and explicit JSON layout export/import. Imports validate contents before replacing anything and never grant weather consent.\n- User-approved default-home selection, a try-first option, Android home-settings shortcut, system-bar/camera-cutout/keyboard inset handling, and larger-label option.\n- No account, ads, analytics, accessibility service, GPS permission, contacts permission, broad storage permission or root requirement.\n\n## First launch\n\n1. Open the APK and review the normal Android installation prompt. If prompted, permit installation only for the file-opening app you chose. Do not globally disable device protections. If your device policy blocks installation, respect that policy.\n2. Open RetroVista. Choose **Try it first** to inspect it before replacing your current home app.\n3. Choose **Make my home**, or **Customize → Make RetroVista the default home**, and confirm the Android prompt.\n4. Use **Customize → Theme & wallpaper** to choose a complete look.\n5. Long-press shortcuts to edit them. The launcher is usable without enabling weather or signing into anything.\n\n## Weather and privacy\n\nWeather is disabled until you search for and select a city. City lookup sends the text you enter to `geocoding-api.open-meteo.com`. Forecast requests send the selected city coordinates to `api.open-meteo.com`. These providers also receive the usual network/IP information. Your actual device location is never requested.\n\nWeather refreshes at most every 30 minutes while the launcher is visible, with a 5-minute automatic retry backoff after failures. Manual refresh has a 30-second throttle. Network connection/read timeouts are 10 seconds each. Weather is model-based, not an on-device sensor reading. No synthetic temperature is displayed when data is unavailable. A fetched timestamp is shown; a failed refresh retains and labels any cached data.\n\nWeath')
          path = Path("README.md")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("a", encoding="utf-8") as out:
              out.write('er data: **Open-Meteo**, CC BY 4.0. City data: **GeoNames**. The bundled free service endpoints are intended for personal, non-commercial use. Provider terms apply; commercial distribution needs a separate review. Weather code/parameter documentation: https://open-meteo.com/en/docs [doc:turn5doc4]. Geocoding documentation: https://open-meteo.com/en/docs/geocoding-api [doc:turn5doc6].\n\nDisable weather through the weather card to erase its local city and cache. A request already in flight may finish, but generation checks prevent it from re-enabling weather or saving stale results. There is no persistent background service or scheduled background job.\n\nThe app list and layout are stored locally and never sent to the weather API. Automatic Android app backup is disabled. **Exported layouts contain app identifiers and your selected city/coordinates**, so keep exported JSON files private. Imports keep weather off until you explicitly opt in again.\n\n## Updates and signing — important\n\nThe workflow produces an automatically signed **debug APK**, suitable for personal testing. No private signing keys are embedded in this project, committed to GitHub, cached by this project, or included in artifacts.\n\nA fresh workflow runner generally generates a different debug signing key. Therefore a build from another run may **not install over** your existing RetroVista installation. Before replacing it:\n\n1. Export your layout with **Customize → Export my layout** and save it somewhere you control.\n2. Switch the default home back to your existing launcher.\n3. Uninstall only RetroVista, then install the new build.\n4. Import your saved layout and select RetroVista as home again if desired.\n\nUninstalling or clearing app data removes the local layout and weather settings. Your other apps and their data are not removed. A stable private signing setup is required for seamless public releases; it is not part of this personal preview. Do not commit a keystore or passwords to solve that problem.\n\nThe workflow requests APK artifact retention of 30 days and report retention of 14 days. Save your downloaded APK and layout export. Repository policies can shorten allowed artifact retention.\n\n## Switch back safely\n\nUse **Customize → Android home settings / switch back** and choose your usual home app. If RetroVista cannot open, open your phone system Settings and use its default-home-app selector instead. Do not disable or uninstall your existing system launcher. This project does not modify the lock screen, notification shade, Recents UI or system navigation.\n\n## Deliberate limits of this preview\n\n- No folders, icon packs, third-party widget hosting, live wallpaper picker, notification badges, work-profile tabs, gesture-navigation modifications, or lock-screen replacement.\n- Portrait phone design; landscape/tablet/multi-window layouts are not optimized. Android may override orientation on some devices.\n- Built-in clock/weather panels, not a full reproduction of proprietary Sense widgets.\n- Existing app icons are displayed; no copyrighted icon pack is bundled.\n- No fake notifications or pretend weather. The initial UI reflects actual installed apps and selected data.\n- No physical S22 Ultra testing has been performed. See `TESTING.md` before relying on it as your default launcher.\n\n## Developer build\n\nThe project pins **AGP 8.9.2, Gradle 8.11.1, JDK 17, compile/target SDK 35**, with minimum SDK 29. AGP 8.9 documents Gradle 8.11.1, Build Tools 35.0.0, JDK 17 and support up to API 35. [doc:turn5doc2]\n\nCI installs Gradle explicitly, so no unverified binary Gradle wrapper is bundled. With the same SDK, JDK and Gradle installed locally:\n\n```text\ngradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug\n```\n\nAPK: `app/build/outputs/apk/debug/app-debug.apk`.\n\nFor a connected test device/emulator:\n\n```text\ngradle :app:connectedDebugAndroidTest\n```\n\nThe sources are plain Java/platform UI; AndroidX and JUnit dependencies are test-only. The artwork is drawn procedurally in Java. The project includes 6 application Java files and 2 Java test files.\n\n## Validation status\n\n**Locally completed:** XML parsing, manifest/privacy checks, Java delimiter/string balance checks, source completeness checks, workflow YAML parsing, embedded-workflow round-trip checks and archive integrity checks.\n\n**Not completed here:** Java compilation/type checking, Gradle resolution, Android lint, JVM test execution, emulator execution, APK installation, or physical-device tests. Java delimiter checks are not a Java compiler. GitHub Actions is configured to perform compilation/lint/JVM tests and optionally emulator tests; no successful cloud build is claimed in advance.\n\nIf a build fails, open the first failed step and share its error text. Do not share your account token or any private key. If runtime behavior fails, switch back to your old launcher and report the steps plus your Android version.\n')
      - name: Write application sources 2 of 7
        shell: python
        run: |
          from pathlib import Path
          path = Path("TESTING.md")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w", encoding="utf-8") as out:
              out.write('# RetroVista test plan\n\n## Run automatically by the normal GitHub build\n\n- Project structural validator (standard-library Python; no Java type checking).\n- Android debug compilation and packaging.\n- 10 JVM test methods: normalization, empty/null search, 12/24-hour formatting, unit conversion, coordinate bounds, shortcut identifier validation, weather descriptions and weather symbols.\n- Android lint; errors stop the build.\n- APK signature verification and SHA-256 generation.\n\n## Optional on Run workflow\n\nThe Android emulator checkbox runs 4 Android test methods on API 35 (Android 15):\n\n1. Home rendering, key controls and weather disabled by default.\n2. App-drawer search and returning home through the HOME intent.\n3. Theme preference persistence across activity recreation.\n4. Backup validation, rejection of invalid shortcuts, and weather remaining disabled after import.\n\nEmulator support depends on the runner. Tests are optional and off by default. The artifact includes `TEST-STATUS.txt` stating whether they ran. A skipped emulator test is not a passing emulator test. A failed enabled emulator step prevents publication of the APK artifact for that run; reports are still attempted.\n\n## S22 Ultra acceptance checklist (not performed here)\n\nKeep your original launcher installed and initially choose Try it first.\n\n- [ ] Open the APK, review first-run UI, verify text is below the camera/status bar and dock above system navigation.\n- [ ] Try the phone display zoom and font-size settings you actually use; scroll the home body if needed.\n- [ ] Choose RetroVista in the system Home-role prompt. Press Home from another app.\n- [ ] Open Apps, scroll the entire list, search by name, tap results, and clear search.\n- [ ] Launch Phone, Messages, Browser and Camera. Replace a system shortcut if your preferred app does not handle that intent.\n- [ ] Long-press a home shortcut, replace/remove it, pin a drawer app, swipe between pages and tap both page buttons.\n- [ ] Install/remove a disposable test app and verify the list refreshes when returning home.\n- [ ] Verify clock time, midnight/noon, 24-hour mode and date changes. Tap clock for alarms.\n- [ ] Switch all three themes; enable large labels; test TalkBack labels and focus.\n- [ ] Confirm weather makes no requests before opt-in; choose an unambiguous city.\n- [ ] Compare °C/°F; disconnect internet, refresh, and verify cached/unavailable status rather than invented data.\n- [ ] Disable weather while a request is pending; ensure it stays disabled afterward.\n- [ ] Export layout to Documents; move a shortcut; import the saved layout; ensure it restores and weather stays off.\n- [ ] Attempt an invalid/oversized JSON import; verify the existing layout is unchanged.\n- [ ] Reboot and check default home and stored shortcuts.\n- [ ] Switch back to your original launcher through Android home settings.\n\n## What this environment actually verified\n\nSee README validation status. Local structural checks passed. Neither the Android toolchain nor runtime was available. Unit and instrumentation test source is included, but the tests were not executed here. This is a personal preview, not a certified production release.\n')
          path = Path("app/build.gradle")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w", encoding="utf-8") as out:
              out.write('plugins { id "com.android.application" }\nandroid {\n    namespace "com.retrovista.launcher"\n    compileSdk 35\n    defaultConfig {\n        applicationId "com.retrovista.launcher"\n        minSdk 29\n        targetSdk 35\n        versionCode 1\n        versionName "1.0.0"\n        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }\n    buildTypes {\n        debug { debuggable true }\n        release { minifyEnabled false }\n    }\n    lint {\n        abortOnError true\n        disable "SetTextI18n", "HardcodedText"\n    }\n}\ndependencies {\n    testImplementation "junit:junit:4.13.2"\n    androidTestImplementation "androidx.test:runner:1.6.2"\n    androidTestImplementation "androidx.test:core:1.6.1"\n    androidTestImplementation "androidx.test.ext:junit:1.2.1"\n}\n')
          path = Path("app/src/androidTest/java/com/retrovista/launcher/LauncherSmokeTest.java")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w", encoding="utf-8") as out:
              out.write('package com.retrovista.launcher;\n\nimport android.content.Context;\nimport android.content.Intent;\nimport android.content.SharedPreferences;\nimport android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.EditText;\nimport android.widget.GridView;\nimport androidx.test.core.app.ActivityScenario;\nimport androidx.test.core.app.ApplicationProvider;\nimport androidx.test.ext.junit.runners.AndroidJUnit4;\nimport org.json.JSONObject;\nimport org.junit.Before;\nimport org.junit.Test;\nimport org.junit.runner.RunWith;\nimport java.util.Map;\nimport static org.junit.Assert.*;\n\n@RunWith(AndroidJUnit4.class)\npublic class LauncherSmokeTest {\n    @Before public void reset() {\n        Context context=ApplicationProvider.getApplicationContext();\n        context.getSharedPreferences("retrovista",Context.MODE_PRIVATE).edit().clear()\n            .putBoolean("welcomed",true).putBoolean("seeded",true).commit();\n    }\n    @Test public void homeRendersAndWeatherStartsOff() {\n        try(ActivityScenario<MainActivity> scenario=ActivityScenario.launch(MainActivity.class)) {\n            scenario.onActivity(a->{\n                assertNotNull(findDescription(a.getWindow().getDecorView(),"Open all apps"));\n                assertNotNull(findDescription(a.getWindow().getDecorView(),"Customize launcher"));\n                assertFalse(a.getSharedPreferences("retrovista",Context.MODE_PRIVATE).getBoolean("weatherEnabled",false));\n            });\n        }\n    }\n    @Test public void drawerSearchAndHomeIntentWork() {\n        try(ActivityScenario<MainActivity> scenario=ActivityScenario.launch(MainActivity.class)) {\n            scenario.onActivity(a->{\n                a.showDrawer("");\n                EditText search=(EditText)findDescription(a.getWindow().getDecorView(),"Search apps");\n                assertNotNull(search);search.setText("no_app_will_match_409742");\n                GridView grid=findType(a.getWindow().getDecorView(),GridView.class);assertNotNull(grid);\n                assertEquals(0,grid.getAdapter().getCount());\n                a.onNewIntent(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME));\n                assertNotNull(findDescription(a.getWindow().getDecorView(),"Open all apps"));\n            });\n        }\n    }\n    @Test public void themeSurvivesRecreation() {\n        try(ActivityScenario<MainActivity> scenario=ActivityScenario.launch(MainActivity.class)) {\n            scenario.onActivity(a->a.getSharedPreferences("retrovista",Context.MODE_PRIVATE).edit().putInt("theme",2).commit());\n            scenario.recreate();\n            scenario.onActivity(a->{\n                assertEquals(2,a.getSharedPreferences("retrovista",Context.MODE_PRIVATE).getInt("theme",0));\n                assertNotNull(findDescription(a.getWindow().getDecorView(),"Open all apps"));\n            });\n        }\n    }\n    @Test public void backupImportNeverGrantsWeatherConsent() throws Exception {\n        JSONObject layout=new JSONObject().put("theme",1).put("clock24",true).put("fahrenheit",false)\n            .put("largeLabels",false).put("motion",true).put("weatherEnabled",true);\n        for(int i=0;i<16;i++)layout.put("slot"+i,"");\n        for(int i=0;i<4;i++)layout.put("dock"+i,"@phone");\n        String json=new JSONObject().put("format","RetroVista-layout").put("version",1).put("layout",layout).toString();\n        Map<String,Object> imported=LayoutBackup.decode(json);\n        assertFalse(imported.containsKey("weatherEnabled"));\n        Context context=ApplicationProvider.getApplicationContext();\n        SharedPreferences prefs=context.getSharedPreferences("retrovista",Context.MODE_PRIVATE);\n        LayoutBackup.apply(prefs,imported);\n        assertFalse(prefs.getBoolean("weatherEnabled",true));\n        assertEquals(1,prefs.getInt("theme",0));\n        layout.put("slot0","https://not-a-shortcut.example");\n        String invalid=new JSONObject().put("format","RetroVista-layout").put("version",1).put("layout",layout).toString();\n        try {LayoutBackup.decode(invalid);fail("Invalid shortcuts must be rejected");}catch(java.io.IOException expected){}\n        assertEquals(1,prefs.getInt("theme",0));\n    }\n    private static View findDescription(View view,String value) {\n        if(value.contentEquals(view.getContentDescription()==null?"":view.getContentDescription()))return view;\n        if(view instanceof ViewGroup) for(int i=0;i<((ViewGroup)view).getChildCount();i++) {\n            View result=findDescription(((ViewGroup)view).getChildAt(i),value);if(result!=null)return result;\n        }\n        return null;\n    }\n    private static <T extends View> T findType(View view,Class<T> type) {\n        if(type.isInstance(view))return type.cast(view);\n        if(view instanceof ViewGroup) for(int i=0;i<((ViewGroup)view).getChildCount();i++) {\n            T result=findType(((ViewGroup)view).getChildAt(i),type);if(result!=null)return result;\n        }\n        return null;\n    }\n}\n')
          path = Path("app/src/main/AndroidManifest.xml")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w", encoding="utf-8") as out:
              out.write('<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <queries><intent>\n        <action android:name="android.intent.action.MAIN" />\n        <category android:name="android.intent.category.LAUNCHER" />\n    </intent></queries>\n    <application android:allowBackup="false" android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher" android:label="@string/app_name"\n        android:supportsRtl="true" android:usesCleartextTraffic="false" android:theme="@style/AppTheme">\n        <activity android:name=".MainActivity" android:exported="true"\n            android:enableOnBackInvokedCallback="false" android:launchMode="singleTask" android:screenOrientation="portrait"\n            android:windowSoftInputMode="adjustResize">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT" />\n            </intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n')
          path = Path("app/src/main/java/com/retrovista/launcher/FlipClock.java")
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w", encoding="utf-8") as out:
              out.write('package com.retrovista.launcher;\n\nimport android.animation.ValueAnimator;\nimport android.content.Context;\nimport android.graphics.*;\nimport android.view.View;\nimport java.util.Calendar;\nimport java.util.Locale;\n\n/** Original split-flap tiles with a brief highlight at minute changes. */\nfinal class FlipClock extends View {\n    private final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);\n    private String hour="00",minute="00",period="";\n    private final boolean twentyFour,animate;\n    private float fold;\n    private ValueAnimator animator;\n    FlipClock(Context c,boolean twentyFour,boolean animate) {\n        super(c); this.twentyFour=twentyFour; this.animate=animate;\n        setFocusable(true); setClickable(true);\n        setImportantForAccessibility(IMPORTANT_FOR_ACCESSIBILITY_YES); update();\n    }\n    void update() {\n        Calendar now=Calendar.getInstance();\n        String nextHour=LauncherLogic.hour(now.get(Calendar.HOUR_OF_DAY),twentyFour);\n        String nextMinute=String.format(Locale.US,"%02d",now.get(Calendar.MINUTE));\n        boolean changed=!minute.equals(nextMinute);\n        hour=nextHour; minute=nextMinute;\n        period=twentyFour ? "" : (now.get(Calendar.AM_PM)==Calendar.AM ? "AM" : "PM");\n        setContentDescription(hour+":"+minute+" "+period+". Open alarms.");\n        if(changed && animate && isAttachedToWindow() && ValueAnimator.areAnimatorsEnabled()) {\n            if(animator!=null) animator.cancel();\n            animator=ValueAnimator.ofFloat(1,0); animator.setDuration(360);\n            animator.addUpdateListener(a->{ fold=(float)a.getAnimatedValue(); invalidate(); });\n            animator.start();\n        }\n        invalidate();\n    }\n    @Override protected void onDetachedFromWindow() {\n        if(animator!=null) animator.cancel(); super.onDetachedFromWindow();\n    }\n    @Override protected void onDraw(Canvas c) {\n        float scale=Math.min(getWidth()/340f,getHeight()/164f);\n        c.save(); c.translate((getWidth()-340*scale)/2,(getHeight()-164*scale)/2); c.scale(scale,scale);\n        tile(c,4,10,156,138,hour); tile(c,180,10,156,138,minute);\n        p.setShader(null); p.setColor(0xCCDBEEE9);\n        c.drawCircle(170,66,2.8f,p); c.drawCircle(170,88,2.8f,p);\n        p.setTypeface(Typeface.create("sans-serif-medium",Typeface.NORMAL)); p.setTextSize(10);\n        p.setTextAlign(Paint.Align.RIGHT); p.setColor(0xFFBBDAD4); c.drawText(period,334,163,p); c.restore();\n    }\n    private void tile(Canvas c,float x,float y,float w,float h,String value) {\n        p.setShader(null); p.setColor(0x55000000);\n        c.drawRoundRect(new RectF(x,y+5,x+w,y+h+5),13,13,p);\n        p.setShader(new LinearGradient(x,y,x,y+h,new int[]{0xFFFFFFFF,0xFFE4ECEB,0xFFCEDAD9},null,Shader.TileMode.CLAMP));\n        c.drawRoundRect(new RectF(x,y,x+w,y+h),12,12,p); p.setShader(null);\n        p.setTypeface(Typeface.create("sans-serif-condensed",Typeface.BOLD));\n        p.setTextAlign(Paint.Align.CENTER); p.setTextSize(107); p.setColor(0xFF203135);\n        c.drawText(value,x+w/2,y+h/2-(p.ascent()+p.descent())/2,p);\n        p.setColor(0x18213236); c.drawRect(x+1,y+h/2,x+w-1,y+h-11,p);\n        p.setColor(0x9921373A); p.setStrokeWidth(1.3f); c.drawLine(x+1,y+h/2,x+w-1,y+h/2,p);\n        p.setColor(0xAAFFFFFF); c.drawLine(x+1,y+h/2+1.5f,x+w-1,y+h/2+1.5f,p);\n        p.setColor(0xFF718784);\n        c.drawRoundRect(new RectF(x-1,y+h/2-5,x+5,y+h/2+5),2,2,p);\n        c.drawRoundRect(new RectF(x+w-5,y+h/2-5,x+w+1,y+h/2+5),2,2,p);\n        if(fold>0) { p.setColor(Color.argb((int)(fold*40),25,44,49)); c.drawRect(x+6,y+h/2-h*.4f*fold,x+w-6,y+h/2,p); }\n    }\n}\n')
      - name: Write application sources 3 of 7
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/src/main/java/com/retrovista/launcher/LauncherLogic.java")
