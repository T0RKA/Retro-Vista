lse(LauncherLogic.validShortcut("https://example.com"));\n        assertFalse(LauncherLogic.validShortcut("@arbitrary"));assertFalse(LauncherLogic.validShortcut(null));\n    }\n    @Test public void weatherCodesHaveRealDescriptions() {\n        assertEquals("Clear sky",LauncherLogic.weatherDescription(0));\n        assertEquals("Heavy rain",LauncherLogic.weatherDescription(65));\n        assertEquals("Conditions unavailable",LauncherLogic.weatherDescription(-1));\n    }\n    @Test public void weatherSymbolsSeparateSnowAndRain() {\n        assertEquals("❄",LauncherLogic.weatherSymbol(85));assertEquals("☂",LauncherLogic.weatherSymbol(61));\n    }\n}\n')
