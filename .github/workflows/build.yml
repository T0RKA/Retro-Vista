      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Check project structure
        run: python3 tools/check_project.py
      - name: Compile, run unit tests, and lint
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Optional Android 15 smoke tests
        if: inputs.run_device_tests == true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          script: gradle --no-daemon --console=plain :app:connectedDebugAndroidTest
      - name: Prepare installable artifact
        env:
          DEVICE_TESTS: ${{ inputs.run_device_tests }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RetroVista-1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/RetroVista-1.0.apk
          cd dist
          sha256sum RetroVista-1.0.apk > SHA256SUMS.txt
          if [ "$DEVICE_TESTS" = "true" ]; then
            echo "Compilation, JVM tests, lint, and API 35 emulator smoke tests passed in this workflow run. Physical Samsung testing remains necessary." > TEST-STATUS.txt
          else
            echo "Compilation, JVM tests, and lint passed. Android emulator tests were NOT RUN. Physical Samsung testing remains necessary." > TEST-STATUS.txt
          fi
          echo "Personal debug APK. A new run may use a different signing key. Export your layout before uninstalling an older build. Never commit keystores or credentials." > INSTALL-NOTES.txt
      - name: Download this artifact to your phone
        uses: actions/upload-artifact@v4
        with:
          name: RetroVista-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroVista-test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
