          with path.open("w", encoding="utf-8") as out:
              out.write('#!/usr/bin/env python3\n# Structural checks only. This is NOT a Java compiler or an Android runtime test.\nfrom pathlib import Path\nimport re\nimport xml.etree.ElementTree as ET\n\nROOT = Path(__file__).resolve().parents[1]\nANDROID = "{http://schemas.android.com/apk/res/android}"\nchecks = 0\n\ndef check(condition, message):\n    global checks\n    if not condition:\n        raise AssertionError(message)\n    checks += 1\n    print("PASS:", message)\n\ndef balanced_java(text, name):\n    # Ignore Java strings, characters and comments before checking delimiters.\n    stack = []\n    i = 0\n    pairs = {"}": "{", ")": "(", "]": "["}\n    while i < len(text):\n        if text.startswith("//", i):\n            end = text.find("\\n", i)\n            i = len(text) if end == -1 else end\n            continue\n        if text.startswith("/*", i):\n            end = text.find("*/", i + 2)\n            check(end != -1, name + " block comment terminates")\n            i = end + 2\n            continue\n        if text[i] in (chr(34), chr(39)):\n            quote = text[i]\n            i += 1\n            closed = False\n            while i < len(text):\n                if text[i] == chr(92):\n                    i += 2\n                elif text[i] == quote:\n                    i += 1\n                    closed = True\n                    break\n                else:\n                    i += 1\n            check(closed, name + " literal terminates")\n            continue\n        char = text[i]\n        if char in "({[":\n            stack.append(char)\n        elif char in ")}]":\n            if not stack or stack.pop() != pairs[char]:\n                raise AssertionError(name + " mismatched delimiters")\n        i += 1\n    check(not stack, name + " delimiters balanced")\n\nfor path in sorted((ROOT / "app/src").rglob("*.xml")):\n    ET.parse(path)\n    check(True, str(path.relative_to(ROOT)) + " XML parses")\n\nmanifest = ET.parse(ROOT / "app/src/main/AndroidManifest.xml").getroot()\npermissions = [x.get(ANDROID + "name") for x in manifest.findall("uses-permission")]\ncheck(permissions == ["android.permission.INTERNET"], "only INTERNET permission requested")\napp = manifest.find("application")\ncheck(app.get(ANDROID + "usesCleartextTraffic") == "false", "cleartext traffic disabled")\ncheck(app.get(ANDROID + "allowBackup") == "false", "automatic app backup disabled")\nactivity = app.find("activity")\ncheck(activity.get(ANDROID + "exported") == "true", "home activity is exported")\nfilters = [{c.get(ANDROID + "name") for c in f.findall("category")} for f in activity.findall("intent-filter")]\ncheck(any({"android.intent.category.HOME", "android.intent.category.DEFAULT"} <= f for f in filters), "HOME and DEFAULT intent filter")\ncheck(any("android.intent.category.LAUNCHER" in f for f in filters), "separate launchable app entry")\ncheck(manifest.find("queries/intent/category").get(ANDROID + "name") == "android.intent.category.LAUNCHER", "narrow app visibility query")\n\nsources = sorted((ROOT / "app/src").rglob("*.java"))\nfor path in sources:\n    text = path.read_text()\n    check("package com.retrovista.launcher;" in text, path.name + " package matches namespace")\n    balanced_java(text, path.name)\n    check(not re.search(r"\\b(TODO|FIXME|UnsupportedOperationException)\\b", text), path.name + " has no placeholder implementation")\n\nmain = (ROOT / "app/src/main/java/com/retrovista/launcher/MainActivity.java").read_text()\ncheck("RoleManager.ROLE_HOME" in main and "isRoleAvailable" in main, "home role requires user choice and availability check")\ncheck("weatherEnabled\\",false" in main, "weather is opt-in")\ncheck("isDestroyed() || generation!=weatherGeneration" in main, "stale weather requests are discarded")\ncheck("handler.removeCallbacks(ticker)" in main, "clock timer is stopped on pause")\ncheck("WindowInsets.Type.ime()" in main, "keyboard insets handled")\ncheck("FLAG_ACTIVITY_NEW_TASK" in main, "apps launch in their own tasks")\nbackup = (ROOT / "app/src/main/java/com/retrovista/launcher/LayoutBackup.java").read_text()\ncheck("65536" in backup and "validShortcut" in backup, "backup size and shortcut validation")\ncheck("putBoolean(\\"weatherEnabled\\",false)" in backup, "backup import does not grant network consent")\nweather = (ROOT / "app/src/main/java/com/retrovista/launcher/WeatherClient.java").read_text()\ncheck("setConnectTimeout(10000)" in weather and "setReadTimeout(10000)" in weather, "weather requests have timeouts")\ncheck("262144" in weather, "weather response size bounded")\ncheck("setInstanceFollowRedirects(false)" in weather, "API redirects not followed")\ncheck("new URL(address)" in weather and "https://api.open-meteo.com/" in weather, "weather endpoint uses HTTPS")\n\nworkflow = ROOT / ".github/workflows/build.yml"\ncheck(workflow.read_bytes() == (ROOT / "BUILD-WORKFLOW.yml").read_bytes(), "visible workflow fallback is identical")\nfor expected in ["8.11.1", "assembleDebug", "testDebugUnitTest", "lintDebug", "connectedDebugAndroidTest", "apksigner", "RetroVista-APK"]:\n    check(expected in workflow.read_text(), "workflow includes " + expected)\ncheck("8.9.2" in (ROOT / "build.gradle").read_text(), "AGP version pinned")\ncheck("compileSdk 35" in (ROOT / "app/build.gradle").read_text(), "compile SDK pinned")\ncheck("minSdk 29" in (ROOT / "app/build.gradle").read_text(), "minimum Android API specified")\nfor path in ROOT.rglob("*"):\n    if path.is_file():\n        check(path.suffix not in (".jks", ".keystore", ".pem"), "no signing secret: " + str(path.relative_to(ROOT)))\nunit = (ROOT / "app/src/test/java/com/retrovista/launcher/LauncherLogicTest.java").read_text()\nsmoke = (ROOT / "app/src/androidTest/java/com/retrovista/launcher/LauncherSmokeTest.java").read_text()\ncheck(unit.count("@Test") == 10, "10 JVM tests supplied (not run by this script)")\ncheck(smoke.count("@Test") == 4, "4 Android tests supplied (not run by this script)")\nprint("\\n", checks, "structural checks passed.")\nprint("Java compilation, JVM tests, Android lint and runtime tests require the Android toolchain.")')
          path = Path("tools/check_project.py")
          path.parent.mkdir(parents=True, exist_ok=True)
